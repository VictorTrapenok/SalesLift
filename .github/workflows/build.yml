name: Build image

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Для нативных аттестаций происхождения сборки (provenance).
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-push:
    # ОДИН job, а не три связанных.
    #
    # Инвариант, который этим достигается: в registry попадает ровно тот образ,
    # который прошёл проверку. Разнеси мы сборку и тест по разным job'ам —
    # пришлось бы либо гонять образ через артефакты, либо публиковать до
    # проверки. Провал теста означает, что не публикуется ничего.
    name: Build, verify and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # На pull_request не логинимся и не публикуем: PR из форка не имеет прав
      # на запись в registry, да и публиковать непроверенный чужой код нельзя.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Встроенный токен — внешних секретов проекту не нужно.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=SalesLift
            org.opencontainers.image.description=Мультитенантный SaaS для аналитики звонков отдела продаж
            org.opencontainers.image.licenses=Proprietary

      # Собираем БЕЗ публикации: образ остаётся в локальном docker демоне.
      # Именно `load: true, push: false` делает правилом «публикуем только
      # проверенное». С `push: true` образ уехал бы в registry до тестов.
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: saleslift:ci
          build-args: |
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_PIPELINE_ID=${{ github.run_id }}
            BUILD_ID=${{ github.run_number }}
          # Кэш слоёв в инфраструктуре GitHub Actions: между прогонами не
          # пересобираются зависимости, если манифесты не менялись.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Проверка собранного образа ──────────────────────────────────────
      #
      # `services:` намеренно не используются: они стартуют ДО шагов, а нам
      # важен порядок «сеть → БД → миграции → приложение → тест». Своя сеть
      # даёт этот контроль явно.
      - name: Isolated network and PostgreSQL
        run: |
          docker network create ci-net-${{ github.run_id }}
          docker run -d --name ci-db-${{ github.run_id }} \
            --network ci-net-${{ github.run_id }} \
            -e POSTGRES_DB=saleslift -e POSTGRES_USER=saleslift -e POSTGRES_PASSWORD=ci_password \
            postgres:18-alpine
          for _ in $(seq 1 30); do
            docker exec ci-db-${{ github.run_id }} pg_isready -U saleslift -d saleslift && break
            sleep 1
          done

      - name: Run migrations in a throwaway container from the built image
        run: |
          docker run --rm --network ci-net-${{ github.run_id }} \
            -e DB_HOST=ci-db-${{ github.run_id }} -e DB_PASSWORD=ci_password \
            -e APP_ENV=development \
            saleslift:ci alembic upgrade head

      - name: Start application from the built image
        run: |
          mkdir -p .ci-artifacts
          docker run -d --name ci-app-${{ github.run_id }} \
            --network ci-net-${{ github.run_id }} \
            -p 8000:8000 \
            -e DB_HOST=ci-db-${{ github.run_id }} -e DB_PASSWORD=ci_password \
            -e APP_MODE=web -e LOG_LEVEL=debug \
            -e JWT_SECRET=ci-secret-at-least-32-characters-long-ok \
            saleslift:ci

      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then
              echo "Application is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::Application did not become ready within 60 seconds"
          docker logs ci-app-${{ github.run_id }}
          exit 1

      # Ворота, решающие судьбу образа: проверяет не «отвечает ли порт», а
      # работает ли продукт — регистрация компании, вход, права, раздача SPA.
      - name: Smoke test
        run: BASE_URL=http://localhost:8000 bash scripts/smoke-test.sh

      # ── Браузерные проверки ─────────────────────────────────────────────
      # Те же ворота, что и дымовой тест, но глазами пользователя: клики по
      # интерфейсу против того же собранного образа. Провал так же не пускает
      # образ в registry. Подробности — в e2e/README.md.
      - name: Set up Node for e2e
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: e2e (Playwright)
        working-directory: e2e
        run: BASE_URL=http://localhost:8000 npm test

      # ── Публикация ──────────────────────────────────────────────────────
      # Сюда мы попадаем, только если всё выше прошло.
      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          while read -r tag; do
            [ -z "$tag" ] && continue
            docker tag saleslift:ci "$tag"
            docker push "$tag"
            echo "Published: $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Published image digest
        id: digest
        if: github.event_name != 'pull_request'
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$FIRST_TAG" | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Нативная аттестация GitHub: подтверждает, что образ собран именно этим
      # workflow из этого коммита. Видна на странице пакета.
      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build image"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Image built and passed the smoke test."
            else
              echo "❌ Failed — nothing was published to the registry."
            fi
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Диагностика и уборка ────────────────────────────────────────────
      - name: Application logs
        if: always()
        run: |
          docker logs ci-app-${{ github.run_id }} > .ci-artifacts/app.log 2>&1 || true
          if [ "${{ job.status }}" != "success" ]; then
            echo "::group::Application logs"; tail -100 .ci-artifacts/app.log; echo "::endgroup::"
          fi

      # Видео каждого сценария плюс HTML-отчёт Playwright — отдельным артефактом
      # со сроком жизни 1 день. Артефакт GitHub скачивается zip'ом: видео
      # `.webm` смотрятся в браузере, отчёт открывается его `index.html`.
      # Инлайнового проигрывания в интерфейсе GitHub нет — только скачивание.
      - name: Upload Playwright videos and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos-${{ github.run_number }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ github.run_number }}
          path: .ci-artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ci-app-${{ github.run_id }} ci-db-${{ github.run_id }} 2>/dev/null || true
          docker network rm ci-net-${{ github.run_id }} 2>/dev/null || true
