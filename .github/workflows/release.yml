name: Release

# Запускается на тег вида v1.2.3 и создаёт запись в списке релизов репозитория.
#
# Порядок важен: сначала build.yml собирает и публикует образ с тем же тегом,
# затем этот workflow дожидается образа и оформляет релиз. Поэтому релиз
# никогда не ссылается на несуществующий образ.
on:
  push:
    tags: ['v*']
  # Позволяет оформить релиз вручную для уже существующего тега.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example, v0.1.0)'
        required: true

permissions:
  contents: write
  # write, а не read: сюда же публикуется Helm-чарт — в GHCR он такой же
  # пакет, как и образ.
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Полная история: без неё нельзя сгенерировать список изменений.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Образ публикует build.yml по тому же тегу. Ждём его: релиз без образа
      # бесполезен — команда установки из описания не сработает.
      - name: Wait for the image to be published
        id: image
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}:${{ steps.version.outputs.version }}"
          echo "Waiting for ${IMAGE}"
          for i in $(seq 1 60); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Image is available"
              echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  attempt ${i}/60..."
            sleep 20
          done
          echo "::error::Image ${IMAGE} never appeared. Check the «Build image» workflow for this tag."
          exit 1

      # ── Helm-чарт ────────────────────────────────────────────────────────
      # Публикуется тем же тегом и ПОСЛЕ образа. Порядок не косметический:
      # чарт по умолчанию ставит образ версии appVersion, поэтому выпущенный
      # раньше образа чарт был бы заведомо неустанавливаемым.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # Та же версия, что и в проверке чарта в test.yml.
          version: v3.16.3

      - name: Package and publish the chart
        id: chart
        run: |
          # OCI-реестр требует путь в нижнем регистре, а github.repository_owner
          # отдаёт имя как оно записано в профиле.
          OWNER="${{ github.repository_owner }}"
          OWNER="${OWNER,,}"
          VERSION="${{ steps.version.outputs.version }}"

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

          # --version и --app-version перебивают значения из Chart.yaml: в
          # репозитории они остаются справочными, источник истины — тег.
          helm package deploy/helm/saleslift \
            --version "$VERSION" --app-version "$VERSION" --destination dist

          helm push "dist/saleslift-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER}/charts"
          echo "chart=oci://${REGISTRY}/${OWNER}/charts/saleslift" >> "$GITHUB_OUTPUT"

      - name: Release notes
        id: notes
        run: |
          IMAGE="${{ steps.image.outputs.image }}"
          cat > release-notes.md <<EOF
          ## Установка

          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git SalesLift
          cd SalesLift
          git checkout ${{ steps.version.outputs.tag }}
          make up
          \`\`\`

          Откройте http://localhost:8000 и зарегистрируйте компанию.

          ## Установка в кластер

          \`\`\`bash
          helm install saleslift ${{ steps.chart.outputs.chart }} \\
            --version ${{ steps.version.outputs.version }} \\
            --namespace saleslift --create-namespace \\
            --set ingress.host=saleslift.example.com
          \`\`\`

          Чарт поднимает и базу — этого достаточно, чтобы начать работать.
          Параметры и промышленная конфигурация — в
          [readme чарта](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/deploy/helm/saleslift/readme.md).

          ## Образ

          \`\`\`
          ${IMAGE}
          \`\`\`

          Образ собран и проверен дымовым тестом до публикации: регистрация
          компании, вход, права и раздача интерфейса работают. К образу
          приложена аттестация происхождения сборки.

          ## Что изменилось
          EOF

          {
            echo "notes<<RELEASE_NOTES_EOF"
            cat release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Создаёт запись в списке релизов репозитория.
      # generate_release_notes=true добавляет список изменений и участников,
      # собранный самим GitHub из коммитов и PR со времени прошлого тега.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SalesLift ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          draft: false
          # Предрелиз для тегов вида v0.1.0-rc1: GitHub пометит их иначе и не
          # будет предлагать как последнюю версию.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.tag, '-') }}

      - name: Summary
        run: |
          {
            echo "### ✅ Release ${{ steps.version.outputs.tag }} published"
            echo ""
            echo "- [Release page](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }})"
            echo "- Chart: \`${{ steps.chart.outputs.chart }}\` (${{ steps.version.outputs.version }})"
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
