name: Checks

# Быстрая обратная связь на каждый push и PR. Тяжёлая сборка образа — в build.yml.
on:
  push:
    branches: ['**']
  pull_request:

# Отменяем прошлые прогоны той же ветки: результат по устаревшему коммиту
# никому не нужен, а очередь он занимает.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: '0.11.28'
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/api/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install backend dependencies
        working-directory: packages/api
        run: uv sync --frozen

      - name: ruff check
        working-directory: packages/api
        run: uv run ruff check --output-format=github .

      - name: ruff format
        working-directory: packages/api
        run: uv run ruff format --check .

      - name: Install frontend dependencies
        working-directory: packages/web
        run: npm ci --no-audit --no-fund

      # Схема нужна кодогенерации, а типы — линтеру фронтенда.
      - name: Generate types
        run: |
          cd packages/api && uv run strawberry export-schema saleslift.graphql.schema:schema > schema.graphql
          cd ../web && npm run codegen

      - name: eslint
        working-directory: packages/web
        run: npm run lint

      - name: prettier
        working-directory: packages/web
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

  typecheck:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/api/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        run: |
          cd packages/api && uv sync --frozen
          cd ../web && npm ci --no-audit --no-fund

      - name: mypy --strict
        working-directory: packages/api
        run: uv run mypy

      - name: Generate types
        run: |
          cd packages/api && uv run strawberry export-schema saleslift.graphql.schema:schema > schema.graphql
          cd ../web && npm run codegen

      - name: tsc --noEmit
        working-directory: packages/web
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest

    # PostgreSQL как сервис GitHub: порт 5433, как ожидает .env.test —
    # поднимать контейнер скриптом здесь не нужно.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: saleslift_test
          POSTGRES_USER: saleslift_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U saleslift_test -d saleslift_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/api/uv.lock

      - name: Install dependencies
        working-directory: packages/api
        run: uv sync --frozen

      # Unit и интеграционные одним прогоном: pytest однопоточен, и это
      # свойство, а не ограничение — тесты делят одну базу (см. docs/testing.md).
      - name: pytest
        working-directory: packages/api
        run: uv run --env-file .env.test pytest tests -v --junit-xml=../../test-results.xml

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: pytest results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

  schema-drift:
    name: GraphQL schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/api/uv.lock

      - name: Install dependencies
        working-directory: packages/api
        run: uv sync --frozen

      # schema.graphql коммитится: это контракт API, его изменения должны быть
      # видны в diff'е при ревью. Здесь ловим «поменял резолвер, но не
      # перегенерировал схему».
      - name: Regenerate and compare
        run: |
          cd packages/api
          uv run strawberry export-schema saleslift.graphql.schema:schema > schema.graphql
          if ! git diff --exit-code schema.graphql; then
            {
              echo "### ❌ schema.graphql is out of date"
              echo ""
              # Одинарные кавычки намеренно: обратные кавычки здесь — разметка
              # markdown, подстановка команды не нужна.
              # shellcheck disable=SC2016
              echo 'Resolvers changed but the schema did not. Run `make codegen` and commit the result.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
