version: 2

# Обновления приезжают PR'ами, а те проходят те же проверки, что и любой другой
# код: линтеры, типы, тесты и дымовой тест собранного образа. Поэтому апдейт,
# который что-то ломает, виден до вливания, а не после.

updates:
  - package-ecosystem: uv
    directory: /packages/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(api)'
    groups:
      # Мелкие обновления одним PR: разбирать десяток патч-версий по отдельности
      # — трата внимания, а не забота о безопасности.
      patch-and-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /packages/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(web)'
    groups:
      patch-and-minor:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'deps(ci)'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'deps(docker)'
    ignore:
      # Версия языка — не зависимость, а решение о тулчейне, и записано оно в
      # четырёх местах сразу: тег базового образа, packages/api/.python-version,
      # python_version у mypy, NODE_VERSION в workflows/test.yml. Dependabot
      # видит только тег и поднимает его в одиночку, а выглядит это как
      # безобидная правка одной строки. Расхождение стоило сломанных миграций
      # (PR #3) — подробности в комментариях к соответствующим FROM в Dockerfile.
      #
      # Патч-версии подтягиваются сами: теги 3.13-slim и 24-alpine плавающие, их
      # пересобирает upstream. Здесь глушатся только minor и major, то есть смена
      # версии языка — её поднимают руками и сразу везде.
      - dependency-name: 'python'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'node'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
