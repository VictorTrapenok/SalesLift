[project]
name = "saleslift-api"
version = "0.1.0"
description = "SalesLift — мультитенантный SaaS для аналитики звонков: GraphQL API и фоновый воркер"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.1",
    "strawberry-graphql[fastapi]>=0.283",
    "uvicorn[standard]>=0.38",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "structlog>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "strawberry-graphql[cli]>=0.321.0",
    "httpx>=0.28",
]
# Активируется, когда появится файловый домен (звонки в S3 или локальной папке).
storage = [
    "aioboto3>=13.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saleslift"]

# ── Ruff: линтер + форматтер ──────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort — импорты только в начале файла, отсортированы
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "ASYNC",    # flake8-async
    "T20",      # flake8-print — print() в коде запрещён, есть логгер
    "RUF",
]
ignore = [
    # Кириллица в строках и комментариях — норма для этого проекта
    # (правило: все комментарии на русском языке).
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Имена интеграционных тестов пишутся по-русски (правило проекта, см. TESTING.md):
# `def test_логин_с_неверным_паролем_бросает_AuthenticationError()`. PEP 3131
# это разрешает, но pep8-naming ругается на не-snake_case — глушим точечно.
"tests/**" = ["N802", "N803", "N806"]
# print() в seed-скрипте — это его интерфейс: он печатает сгенерированные креды.
"src/saleslift/tools/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["saleslift"]

# ── Mypy: строгий режим ───────────────────────────────────────────────────
# Правило проекта «всегда указывай явный тип возвращаемого значения»
# закрепляется здесь, а не только на словах в CLAUDE.md.
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["strawberry.ext.mypy_plugin"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# У части библиотек нет type stubs — не считаем это ошибкой.
module = ["asyncpg.*", "aioboto3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Декораторы Strawberry (@strawberry.field, @strawberry.mutation) не типизированы
# настолько, чтобы пройти disallow_untyped_decorators: mypy считает, что они
# «расстрачивают» типы обёрнутой функции. Отключаем ТОЧЕЧНО и только это правило
# и только в GraphQL-слое — все остальные строгие проверки, включая обязательные
# аннотации возвращаемых значений, здесь продолжают действовать.
module = ["saleslift.graphql.*"]
disallow_untyped_decorators = false

# ── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode=auto — async-тесты не требуют декоратора @pytest.mark.asyncio.
asyncio_mode = "auto"
# Один event loop на весь прогон — и для фикстур, и для тестов. Обе настройки
# обязаны совпадать: движок БД создаётся session-scoped фикстурой, и если тесты
# крутятся в своих function-scoped loop'ах, соединения asyncpg оказываются
# привязаны к чужому loop'у и падают с «attached to a different loop».
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: тест требует реальной PostgreSQL (см. TESTING.md)",
]
