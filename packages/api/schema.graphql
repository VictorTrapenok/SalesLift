"""Результат успешной авторизации"""
type AuthPayload {
  token: String!
  user: User!
}

"""Информация о сборке образа"""
type BuildInfo {
  branch: String!
  pipelineId: String!
  buildId: String!
}

"""Смена собственного пароля"""
input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

"""Данные нового сотрудника"""
input CreateEmployeeInput {
  name: String!
  email: String!
  password: String!
  role: String!
}

"""Date with time (isoformat)"""
scalar DateTime

"""Состояние сервиса"""
type HealthStatus {
  status: String!
  version: String!
  build: BuildInfo!
}

"""Данные входа"""
input LoginInput {
  email: String!
  password: String!
}

"""Корневые мутации"""
type Mutation {
  """Зарегистрировать компанию и стать её администратором"""
  resolverAuthRegister(input: RegisterInput!): AuthPayload!

  """Войти по e-mail и паролю"""
  resolverAuthLogin(input: LoginInput!): AuthPayload!

  """Завести сотрудника в компании"""
  resolverUsersCreate(input: CreateEmployeeInput!): User!

  """Изменить свой профиль"""
  resolverProfileUpdate(input: UpdateProfileInput!): User!

  """Сменить свой пароль"""
  resolverProfileChangePassword(input: ChangePasswordInput!): User!

  """Сохранить настройки компании"""
  resolverOrgSettingsUpdate(input: UpdateOrgSettingsInput!): Tenant!
}

"""Корневые запросы"""
type Query {
  """Состояние сервиса и информация о сборке"""
  health: HealthStatus!

  """Профиль текущего сотрудника"""
  resolverAuthMe: User!

  """Список сотрудников компании"""
  resolverUsersList: [User!]!

  """Настройки компании текущего сотрудника"""
  resolverOrgSettingsGet: Tenant!
}

"""Данные регистрации новой компании"""
input RegisterInput {
  companyName: String!
  adminName: String!
  email: String!
  password: String!
  locale: String! = "en"
}

"""Компания-клиент"""
type Tenant {
  id: UUID!
  name: String!
  plan: String!
  country: String
  website: String
  contactPhone: String
}

scalar UUID

"""Настройки компании"""
input UpdateOrgSettingsInput {
  name: String!
  country: String = null
  website: String = null
  contactPhone: String = null
}

"""Изменения профиля"""
input UpdateProfileInput {
  name: String!
  bio: String = null
  locale: String = null
}

"""Сотрудник компании"""
type User {
  id: UUID!
  name: String!
  email: String!
  bio: String
  locale: String!
  status: String!
  lastLoginAt: DateTime
  tenant: Tenant!
  role: String!
  permissions: [String!]!
  effectivePermissions: [UserPermissions!]!
}

enum UserPermissions {
  Viewer
  Manager
  Admin
  Permission_users_see
  Permission_users_create
  Permission_org_settings_see
  Permission_org_settings_edit
}
