{{/* Точка входа в web-поды. Worker HTTP не слушает и в выборку не попадает. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "saleslift.fullname" . }}
  labels:
    {{- include "saleslift.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "saleslift.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
