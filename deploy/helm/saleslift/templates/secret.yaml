{{/*
Секреты релиза. Создаётся только то, что не подставлено снаружи: если оба
секрета заданы через existingSecret, этого объекта в релизе не будет вовсе.
*/}}
{{- $needJwt := not .Values.app.jwt.existingSecret -}}
{{- $needDb := not (include "saleslift.dbExistingSecret" .) -}}
{{- if or $needJwt $needDb }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "saleslift.secretName" . }}
  labels:
    {{- include "saleslift.labels" . | nindent 4 }}
  annotations:
    # Переживает `helm uninstall` намеренно. Диск встроенной PostgreSQL — это
    # PVC из volumeClaimTemplate, а такие PVC k8s при удалении StatefulSet не
    # трогает. Удали мы вместе с релизом ещё и пароль — повторная установка
    # сгенерировала бы новый, и приложение не смогло бы войти в собственную
    # базу с сохранившимися данными. Убирается вручную:
    #   kubectl delete secret {{ include "saleslift.secretName" . }}
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if $needJwt }}
  jwt-secret: {{ include "saleslift.resolveSecret" (dict "root" . "key" "jwt-secret" "value" .Values.app.jwt.secret "length" 48) | quote }}
  {{- end }}
  {{- if $needDb }}
  db-password: {{ include "saleslift.resolveSecret" (dict "root" . "key" "db-password" "value" (ternary .Values.postgresql.auth.password .Values.externalDatabase.password .Values.postgresql.enabled) "length" 24) | quote }}
  {{- end }}
{{- end }}
